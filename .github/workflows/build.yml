name: Build WinForms App

on:
  push:
    branches: [ main, master ] # Triggers whenever you push code
  workflow_dispatch: # Allows you to click a button to manually run it

jobs:
  build:
    runs-on: windows-latest # Tells GitHub to use a free cloud Windows machine

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet (Restore Dependencies)
      uses: nuget/setup-nuget@v2

    - name: Restore Packages
      run: nuget restore "Project Portfolio.sln"

    - name: Build Application to Release
      run: msbuild "Project Portfolio.sln" /p:Configuration=Release /p:Platform="Any CPU"

    - name: Upload Final Executable
      uses: actions/upload-artifact@v4
      with:
        name: Final-WinForm-App
        path: |
          **/bin/Release/**/*.exe
          **/bin/Release/**/*.dll
