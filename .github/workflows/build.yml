name: Build WinForms App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x' # Matches your project target framework

    - name: Add Missing Dependency
      run: dotnet add "Project Portfolio.csproj" package System.Management --version 8.0.0

    - name: Restore Dependencies
      run: dotnet restore "Project Portfolio.csproj"

    - name: Publish Executable
      run: |
        dotnet publish "Project Portfolio.csproj" -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishReadyToRun=true

    - name: Upload Final Executable
      uses: actions/upload-artifact@v4
      with:
        name: Final-WinForm-App
        path: |
          **/bin/Release/net8.0-windows/win-x64/publish/*.exe
          **/bin/Release/net8.0-windows/win-x64/publish/*.dll
